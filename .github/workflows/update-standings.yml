name: Update Football Standings

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get league standings
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          leagues = {
              "premier-league": "PL",
              "bundesliga": "BL1",
              "eredivisie": "DED",
              "la-liga": "PD",
              "ligue-1": "FL1",
              "serie-a": "SA",
              "primeira-liga": "PPL",
              "brazil-serie-a": "BSA",
              "championship": "ELC"
          }

          all_standings = {}

          for name, code in leagues.items():

              url = f"https://api.football-data.org/v4/competitions/{code}/standings"

              request = urllib.request.Request(
                  url,
                  headers={
                      "X-Auth-Token": os.environ["FOOTBALL_DATA_TOKEN"]
                  }
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      data = json.load(response)

                  table = data["standings"][0]["table"]

                  standings = []

                  for team in table:
                      standings.append({
                          "position": team["position"],
                          "team": team["team"]["name"],
                          "played": team["playedGames"],
                          "won": team["won"],
                          "draw": team["draw"],
                          "lost": team["lost"],
                          "goalDifference": team["goalDifference"],
                          "points": team["points"]
                      })

                  all_standings[name] = standings

                  print(f"{name}: updated successfully")

              except Exception as e:
                  print(f"{name}: could not update - {e}")

          with open("standings.json", "w") as file:
              json.dump(all_standings, file, indent=2)

          print("All league standings updated.")

          PY

      - name: Save updated standings
        run: |
          git config user.name "Trebz Football Bot"
          git config user.email "actions@github.com"
          git add standings.json
          git diff --cached --quiet || git commit -m "Update football standings"
          git push
