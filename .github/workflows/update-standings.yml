name: Update Football Standings

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-standings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Premier League standings
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = "https://api.football-data.org/v4/competitions/PL/standings"

          request = urllib.request.Request(
              url,
              headers={
                  "X-Auth-Token": os.environ["FOOTBALL_DATA_TOKEN"]
              }
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          table = data["standings"][0]["table"]

          standings = []

          for team in table:
              standings.append({
                  "position": team["position"],
                  "team": team["team"]["name"],
                  "played": team["playedGames"],
                  "won": team["won"],
                  "draw": team["draw"],
                  "lost": team["lost"],
                  "goalDifference": team["goalDifference"],
                  "points": team["points"]
              })

          with open("standings.json", "w") as file:
              json.dump(standings, file, indent=2)

          print("Standings updated successfully.")

          PY

      - name: Save updated standings
        run: |
          git config user.name "Trebz Football Bot"
          git config user.email "actions@github.com"
          git add standings.json
          git diff --cached --quiet || git commit -m "Update football standings"
          git push
