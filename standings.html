<script>
const params = new URLSearchParams(window.location.search);
const league = params.get("league") || "premier-league";

const leagues = {
    "premier-league": {
        name: "Premier League",
        logo: "PL",
        desc: "England's top flight"
    },
    "la-liga": {
        name: "La Liga",
        logo: "LL",
        desc: "Spain's top flight"
    },
    "serie-a": {
        name: "Serie A",
        logo: "SA",
        desc: "Italy's top flight"
    },
    "bundesliga": {
        name: "Bundesliga",
        logo: "BL",
        desc: "Germany's top flight"
    },
    "ligue-1": {
        name: "Ligue 1",
        logo: "L1",
        desc: "France's top flight"
    },
    "eredivisie": {
        name: "Eredivisie",
        logo: "ED",
        desc: "Netherlands' top flight"
    },
    "primeira-liga": {
        name: "Primeira Liga",
        logo: "PT",
        desc: "Portugal's top flight"
    },
    "brazil-serie-a": {
        name: "Brasileirão Série A",
        logo: "BSA",
        desc: "Brazil's top flight"
    },
    "championship": {
        name: "Championship",
        logo: "ELC",
        desc: "England's second tier"
    }
};

const data = leagues[league] || leagues["premier-league"];

document.getElementById("leagueLogo").textContent = data.logo;
document.getElementById("leagueName").textContent = data.name;

async function loadStandings() {
    const table = document.getElementById("standingsTable");

    try {
        const response = await fetch("standings.json?time=" + Date.now());

        if (!response.ok) {
            throw new Error("Could not load standings");
        }

        const allStandings = await response.json();
        const standings = allStandings[league];

        if (!standings) {
            throw new Error("No standings available");
        }

        table.innerHTML = "";

        standings.forEach(team => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${team.position}</td>
                <td>${team.team}</td>
                <td>${team.played}</td>
                <td>${team.won}</td>
                <td>${team.draw}</td>
                <td>${team.lost}</td>
                <td>${team.goalDifference}</td>
                <td>${team.points}</td>
            `;

            table.appendChild(row);
        });

    } catch (error) {
        table.innerHTML = `
            <tr>
                <td colspan="8">
                    Unable to load standings.
                </td>
            </tr>
        `;

        console.error(error);
    }
}

loadStandings();
</script>

</body>
  </html>
